<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SLIM21 — By Annelisy Karoline</title><style>:root{font-family:system-ui,Arial;background:#090e18;color:#f3f7ff}*{box-sizing:border-box}body{margin:0}header{padding:24px 18px;background:linear-gradient(120deg,#101c35,#073d88);border-bottom:2px solid #168bff}main{max-width:920px;margin:auto;padding:16px}h1{margin:0;font-size:28px}h2{font-size:19px;color:#7fc2ff}.muted,small{color:#9eb0cb}nav{display:flex;gap:8px;overflow:auto;padding:12px 0;position:sticky;top:0;background:#090e18}button{background:#137dff;color:white;border:0;border-radius:10px;padding:11px 14px;font-weight:650;cursor:pointer}button.alt{background:#1d2b45}button.active{background:#62b5ff;color:#081528}.card{background:#121e31;border:1px solid #263e60;border-radius:15px;padding:16px;margin-bottom:14px}label{display:block;margin:10px 0 5px;color:#b6c9e5}input,select,textarea{background:#0b1424;border:1px solid #36516f;border-radius:9px;color:white;padding:10px;width:100%;font:inherit}textarea{resize:vertical}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.exercise{border-top:1px solid #30415a;padding:13px 0}.exercise strong{display:block}.exercise .row input{width:85px}a{color:#7fc2ff}.hidden{display:none}.pill{display:inline-block;background:#153e70;border-radius:12px;padding:4px 9px;color:#a9d5ff}img.meal{max-height:170px;max-width:100%;border-radius:9px}footer{padding:22px;text-align:center;color:#9eb0cb}</style></head><body><header><div style="max-width:920px;margin:auto"><small>SEU ACOMPANHAMENTO FITNESS</small><h1>⚡ SLIM21 <span style="font-size:14px">By Annelisy Karoline</span></h1><p>21 dias de consistência, força e recuperação.</p></div></header><main><nav id="nav"></nav><section id="home"></section><section id="treinos" class="hidden"></section><section id="diario" class="hidden"></section><section id="evolucao" class="hidden"></section><section id="dados" class="hidden"></section></main><footer>Versão local de demonstração • Sem login nem sincronização online</footer><script>
const key='slim21_blue_v1';let db;try{db=JSON.parse(localStorage.getItem(key))||{}}catch{db={}};db.logs ||= {};db.days ||= {};db.measures ||= [];let tab='home';const $=id=>document.getElementById(id),save=()=>{try{localStorage.setItem(key,JSON.stringify(db))}catch{alert('Armazenamento cheio: faça backup e reduza as fotos.')}},today=()=>{let d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const plan=[['Segunda • Quadríceps + panturrilha',[['Leg press','3 × 8–12'],['Cadeira extensora','3 × 10–15'],['Hack (somente sem dor)','2 × 8–12'],['Panturrilha sentada','3 × 10–15'],['Dead bug','2 × 8 por lado']]],['Terça • Costas + braços',[['Puxada alta','3 × 8–12'],['Remada com apoio de peito','3 × 8–12'],['Rosca direta','2 × 8–12'],['Tríceps na polia','2 × 10–15']]],['Quarta • Posterior + glúteos + ombros',[['Mesa flexora','3 × 8–12'],['Elevação pélvica na máquina','3 × 8–12'],['Cadeira abdutora','2 × 12–15'],['Elevação lateral','3 × 10–15'],['Prancha lateral','2 × 20 s por lado']]],['Quinta • Quadríceps + panturrilha + tríceps',[['Leg press','3 × 10–12'],['Cadeira extensora','2 × 12–15'],['Panturrilha em pé','3 × 10–15'],['Tríceps polia com corda','2 × 10–15']]],['Sexta • Posterior + glúteos + costas + braços',[['Cadeira flexora','3 × 10–15'],['Elevação pélvica na máquina','2 × 10–12'],['Remada com apoio','2 × 10–12'],['Rosca alternada','2 × 10–12'],['Desenvolvimento na máquina','2 × 8–12']]],['Fim de semana • Opcional leve',[['Dead bug','2 × 8 por lado'],['Bird dog','2 × 8 por lado'],['Prancha lateral','2 × 20 s por lado']]]];const video=q=>'https://www.youtube.com/results?search_query='+encodeURIComponent(q+' execução exercício musculação');function change(t){tab=t;render()}function render(){let tabs=[['home','Início'],['treinos','Treinos'],['diario','Diário'],['evolucao','Evolução'],['dados','Backup']];$('nav').innerHTML=tabs.map(([id,label])=>`<button class="${tab===id?'active':'alt'}" onclick="change('${id}')">${label}</button>`).join('');tabs.forEach(([id])=>$(id).classList.toggle('hidden',id!==tab));$('home').innerHTML=`<div class="card"><h2>Seu objetivo</h2><p>Definição corporal com preservação muscular, sem restrições extremas. <span class="pill">63 kg • 1,64 m</span></p><p class="muted">Este é um roteiro inicial de treinos, não uma prescrição clínica. Pare exercícios que causem dor lombar e procure avaliação profissional.</p></div><div class="grid"><div class="card"><h2>🏋️ Treino de hoje</h2><p>${esc(plan[Math.min((new Date().getDay()+6)%7,5)][0])}</p><button onclick="change('treinos')">Abrir ficha</button></div><div class="card"><h2>💧 Água hoje</h2><p>${(db.days[today()]?.water||0)} ml registrados</p><button onclick="change('diario')">Registrar</button></div></div><div class="card"><h2>Como usar</h2><p>Registre séries, repetições, carga, refeições, fotos e recuperação. Comece com cargas controláveis e 1–3 repetições em reserva. Aumente apenas se a execução estiver boa e sem dor.</p></div>`;$('treinos').innerHTML=`<div class="card"><h2>Ficha de musculação</h2><p class="muted">Escolha o dia, anote a carga real e as repetições. Sugestões de vídeos abrem uma busca demonstrativa, não um vídeo validado individualmente.</p><label>Dia</label><select id="workDay" onchange="workRender()">${plan.map((p,i)=>`<option value="${i}">${esc(p[0])}</option>`).join('')}</select><div id="workContent"></div></div>`;workRender();diaryRender();measureRender();$('dados').innerHTML=`<div class="card"><h2>Seus dados e privacidade</h2><p>Esta versão salva dados somente neste navegador, sem senha e sem sincronização. Para uso privado entre dispositivos será necessário configurar hospedagem, autenticação e banco de dados com acesso protegido.</p><div class="row"><button onclick="backup()">Exportar backup JSON</button><label style="margin:0">Importar backup<input type="file" accept="application/json" onchange="restore(this.files[0])"></label></div></div>`}
function workRender(){let i=Number($('workDay').value),d=plan[i],date=today();$('workContent').innerHTML=`<label>Data do treino</label><input type="date" id="workDate" value="${date}" onchange="workItems()"><label>Energia antes do treino (1–5)</label><select id="energy">${[1,2,3,4,5].map(x=>`<option>${x}</option>`).join('')}</select><label>Alimentação antes do treino</label><input id="prefood" placeholder="Ex.: banana 30 min antes"><div id="workItems"></div><button onclick="saveWorkout()">Salvar treino</button>`;workItems()}function workItems(){let i=Number($('workDay').value),date=$('workDate').value,log=db.logs[date+'-'+i]||{};$('workItems').innerHTML=plan[i][1].map(([name,reps],j)=>`<div class="exercise"><strong>${esc(name)}</strong><small>${reps}</small> • <a target="_blank" rel="noopener" href="${video(name)}">Ver execução</a><div class="row"><label>Carga (kg)<input type="number" min="0" step=".5" id="kg${j}" value="${esc(log.items?.[j]?.kg??'')}"></label><label>Repetições feitas<input type="text" id="rep${j}" placeholder="ex.: 12/11/10" value="${esc(log.items?.[j]?.rep??'')}"></label></div></div>`).join('');$('energy').value=log.energy||3;$('prefood').value=log.prefood||''}function saveWorkout(){let i=Number($('workDay').value),date=$('workDate').value;db.logs[date+'-'+i]={energy:$('energy').value,prefood:$('prefood').value,items:plan[i][1].map((_,j)=>({kg:$('kg'+j).value,rep:$('rep'+j).value}))};save();alert('Treino salvo neste navegador!')}
function day(){let date=$('entryDate')?.value||today();return db.days[date] ||= {water:0,meals:[]}}function diaryRender(){let date=$('entryDate')?.value||today();let d=db.days[date]||{water:0,meals:[]};$('diario').innerHTML=`<div class="card"><h2>Diário de alimentação e hidratação</h2><label>Data</label><input type="date" id="entryDate" value="${date}" onchange="diaryRender()"><h2>💧 Água: ${d.water||0} ml</h2><div class="row"><button onclick="water(200)">+200 ml</button><button onclick="water(500)">+500 ml</button><button class="alt" onclick="water(-200)">Corrigir −200 ml</button></div><p class="muted">Registre o consumo real; a meta depende de calor, suor e orientação individual.</p></div><div class="card"><h2>🍽️ Refeições</h2><label>Tipo</label><select id="mealType"><option>Café da manhã</option><option>Almoço</option><option>Lanche</option><option>Jantar</option><option>Ceia</option></select><label>Alimentos e quantidades</label><textarea id="mealText" rows="3" placeholder="Ex.: arroz, feijão, frango e salada"></textarea><label>Foto opcional</label><input type="file" id="mealFile" accept="image/*"><button onclick="addMeal()">Adicionar refeição</button>${(d.meals||[]).map((m,i)=>`<div class="exercise"><strong>${esc(m.type)}</strong><p>${esc(m.text)}</p>${m.photo?`<img class="meal" src="${m.photo}">`:''}<p><button class="alt" onclick="deleteMeal(${i})">Excluir</button></p></div>`).join('')}</div><div class="card"><h2>😴 Recuperação</h2><label>Sono (horas)</label><input id="sleep" type="number" min="0" max="24" step=".5" value="${esc(d.sleep||'')}"><label>Cansaço do dia (1–5)</label><select id="fatigue">${[1,2,3,4,5].map(x=>`<option ${String(d.fatigue)===String(x)?'selected':''}>${x}</option>`).join('')}</select><label>Observações / digestão</label><textarea id="notes" rows="3">${esc(d.notes||'')}</textarea><button onclick="saveDay()">Salvar dia</button></div>`}function water(v){let d=day();d.water=Math.max(0,(d.water||0)+v);save();diaryRender()}function saveDay(){let d=day();d.sleep=$('sleep').value;d.fatigue=$('fatigue').value;d.notes=$('notes').value;save();alert('Dia salvo!')}function deleteMeal(i){day().meals.splice(i,1);save();diaryRender()}async function addMeal(){let f=$('mealFile').files[0],photo='';if(f){if(!f.type.startsWith('image/'))return alert('Escolha uma imagem');photo=await new Promise(resolve=>{let img=new Image(),u=URL.createObjectURL(f);img.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,640/img.width,640/img.height);c.width=img.width*scale;c.height=img.height*scale;c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);resolve(c.toDataURL('image/jpeg',.55))};img.onerror=()=>resolve('');img.src=u})}let d=day();d.meals ||= [];d.meals.push({type:$('mealType').value,text:$('mealText').value,photo});save();diaryRender()}
function measureRender(){$('evolucao').innerHTML=`<div class="card"><h2>📏 Medidas e evolução</h2><p class="muted">Compare medidas pela manhã, nas mesmas condições. Mudanças pós-refeição são normais.</p><label>Data</label><input type="date" id="mdate" value="${today()}"><label>Peso (kg)</label><input type="number" id="weight" step=".1" placeholder="63"><label>Cintura (cm)</label><input type="number" id="waist" step=".1"><label>Observações</label><input id="mnote"><button onclick="addMeasure()">Salvar medida</button>${db.measures.map((m,i)=>`<div class="exercise">${esc(m.date)} — ${esc(m.weight)} kg • cintura ${esc(m.waist)} cm — ${esc(m.note)} <button class="alt" onclick="delMeasure(${i})">Excluir</button></div>`).join('')}</div>`}function addMeasure(){db.measures.push({date:$('mdate').value,weight:$('weight').value,waist:$('waist').value,note:$('mnote').value});save();measureRender()}function delMeasure(i){db.measures.splice(i,1);save();measureRender()}function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='slim21-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function restore(f){if(!f)return;try{let v=JSON.parse(await f.text());if(!v||typeof v!=='object'||Array.isArray(v))throw Error();if(confirm('Substituir os registros atuais pelo backup?')){db=v;db.logs ||= {};db.days ||= {};db.measures ||= [];save();render()}}catch{alert('Backup inválido')}}render();</script></body></html>
